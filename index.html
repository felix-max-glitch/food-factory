<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Factory Fight</title>
<style>
:root{--bg:#d9dbe0;--fg:#1b1d21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--fg:#eceff4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111316;--fg:#eceff4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
#w{position:relative;width:100%;max-width:960px;aspect-ratio:960/690}
#w canvas{position:absolute;left:0;width:100%;display:block}
#gl{top:7.2464%;height:63.7681%}
#c{top:0;height:100%;pointer-events:none}
p{margin:8px;text-align:center;opacity:.75}
#tp{display:none;width:100%;max-width:960px;box-sizing:border-box;padding:8px 10px 14px;justify-content:space-between;align-items:flex-start;gap:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
body.touch #tp{display:flex}
#tp button{font:800 15px system-ui,sans-serif;color:#fff;border:2px solid rgba(255,255,255,.55);border-bottom-width:4px;border-radius:14px;min-width:46px;height:46px;padding:0 8px;margin:0;background:linear-gradient(180deg,#6b7280,#3b4150);touch-action:none;-webkit-tap-highlight-color:transparent;text-shadow:0 2px 0 #0006}
#tp button.on{filter:brightness(1.5);transform:translateY(2px)}
#tp .grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#tl,#tr{display:flex;flex-direction:column;gap:8px;align-items:center}
#tl{flex:0 0 auto}#tr{flex:1 1 auto;align-items:flex-end}
#dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#dp button{min-width:0;width:52px;height:52px;font-size:20px}
.cA{background:linear-gradient(180deg,#ffb347,#e8751a)!important}.cB{background:linear-gradient(180deg,#5dff8a,#14b84a)!important}.cC{background:linear-gradient(180deg,#ff6f9c,#d62463)!important}.cD{background:linear-gradient(180deg,#58c8ff,#2a74ff)!important}.cE{background:linear-gradient(180deg,#c77dff,#7a3bd6)!important}
@media (orientation:portrait){
 #tp button{font-size:12px;min-width:38px;height:40px;padding:0 5px;border-radius:11px}
 #dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px}#dp button{width:44px;height:44px;font-size:17px}
 #tl,#tr{gap:6px}#tl .grp,#tr .grp{gap:4px}
}
@media (orientation:landscape) and (max-height:620px){
 body.touch{flex-direction:row;align-items:center;justify-content:center;min-height:100vh;height:100vh;overflow:hidden}
 body.touch #tp{display:contents}
 body.touch #tl{order:1;width:172px;padding:0 6px}body.touch #tr{order:3;width:172px;align-items:center;padding:0 6px;flex:0 0 auto}
 body.touch #w{order:2;width:min(calc(100vw - 360px),calc(100vh * 960 / 690));flex:0 0 auto}
 body.touch>p{display:none}
}
</style></head><body>
<div id="w"><canvas id="gl"></canvas><canvas id="c" width="960" height="690"></canvas></div>
<div id="tp"><div id="tl"><div id="dp"><span></span><button data-k="arrowup">▲</button><span></span><button data-k="arrowleft">◀</button><span></span><button data-k="arrowright">▶</button><span></span><button data-k="arrowdown">▼</button><span></span></div>
<div class="grp"><button class="cB" data-k="o">Solo</button><button class="cD" data-k="m">Online</button><button class="cC" data-k="t">Cup</button><button class="cD" data-k="x">Worlds</button><button class="cA" data-k="b">Shop</button><button class="cE" data-k="l">Login</button><button class="cB" data-k="r">Book</button><button class="cC" data-k="c">Daily</button><button class="cD" data-k="g">Boss</button></div>
<div class="grp"><button class="cE" data-k="e">Act</button><button data-k="Enter">OK</button><button data-k="Tab">Tab</button><button data-k="Escape">Back</button><button data-k="p">Pause</button></div></div>
<div id="tr"><div class="grp"><button class="cA" data-k="1">1</button><button class="cA" data-k="2">2</button><button class="cA" data-k="3">3</button><button class="cA" data-k="4">4</button></div>
<div class="grp"><button class="cB" data-k="q">Fuse</button><button class="cD" data-k="e">Hatch</button><button class="cC" data-k="f">Punch</button></div>
<div class="grp"><button class="cE" data-k=" ">Fly</button><button class="cB" data-k="9">Heal</button><button class="cC" data-k="8">TNT</button><button class="cB" data-k="g">Gun</button></div>
<div class="grp"><button class="cA" data-k="7">Peel</button><button class="cC" data-k="6">Sauce</button><button class="cB" data-k="5">Truck</button><button class="cD" data-k="0">Spoon</button></div></div></div>
<p id="hint">A physical keyboard is needed.</p>
