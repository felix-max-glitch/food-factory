      else{const st=Math.min(d,380*dt);p.ax+=dx/d*st;p.az+=dz/d*st;p.face=Math.atan2(dx,dz);p.mv=true}}
    else if(p.st==='insert'){p.t+=dt;p.mv=false;if(p.t>=p.dur){p.st='fusing';p.t=0;p.dur=p.tubes[0]&&p.tubes[1]?1.8:.9;p.lock=false}}

        const r=p.egg.r;if(r>1.15)pop((p.side?490:10)+203,620,'GREAT FUSION!','#7dff8a');else if(r<.9)pop((p.side?490:10)+203,620,'Yuck…','#ff7a7a')}

  });
  units.forEach(u=>{
    const d=u.side?-1:1,ly=LANES[u.lane];u.t+=dt;u.sta-=dt;u.cd-=dt;
    const cr=u.sta<=0;let tgt=null,best=40;
    for(const o of units)if(o.side!==u.side&&o.lane===u.lane){const dx=Math.abs(o.x-u.x);if(dx<best){best=dx;tgt=o}}
    const atBase=u.side?u.x<=100:u.x>=860;
    u.fight=!!(tgt||atBase);
    if(u.fight){
      if(u.cd<=0){u.cd=cr?1.6:1;const dmg=u.atk*(cr?.5:1);
        if(tgt){tgt.hp-=dmg;fx(tgt.x,ly,Math.round(dmg))}else{P[1-u.side].hp-=dmg;shake=.3;fx(u.x+d*22,ly,Math.round(dmg))}}
    }else u.x+=d*u.spd*(cr?.4:1)*dt;
  });
  units=units.filter(u=>{if(u.hp<=0){burst(u.x,LANES[u.lane]);scene.remove(u.m);return false}return true});
  parts.forEach(q=>{q.ox+=q.vx*dt;q.oy+=q.vy*dt;q.l-=dt});parts=parts.filter(q=>q.l>0);
  if(P[0].hp<=0||P[1].hp<=0){mode='over';winner=P[0].hp<P[1].hp?1:0;if(winner===0){if(SOLO)award([0,10,20,30][DIFF]);else if(NET==='host')award(20)}}
}

 pb=mk('Pause (P)','left:50%;transform:translateX(-50%);');hb=mk('Home menu','left:50%;transform:translateX(-50%);top:46px;');
