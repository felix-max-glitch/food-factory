const balls=[];
function throwBall(gx,gy){
  const nx=gx/W*2-1,ny=1-(gy-50)/440*2;cam.updateMatrixWorld();
  const v=new THREE.Vector3(nx,ny,.5).unproject(cam),d=v.sub(cam.position).normalize();if(!(d.y<-.01))return;
  const t=-cam.position.y/d.y,wx=cam.position.x+d.x*t,wz=cam.position.z+d.z*t;dropBall(wx,wz)}
function dropBall(wx,wz){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),new THREE.MeshStandardMaterial({color:0xff3b30,emissive:0x661100,roughness:.3}));m.position.set(wx,9,wz);m.castShadow=true;scene.add(m);
  balls.push({m,wx,wz,y:9,v:0})}
function ballTick(dt){
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.v+=30*dt;b.y-=b.v*dt;b.m.position.y=Math.max(.5,b.y);
    if(b.y<=.5){scene.remove(b.m);balls.splice(i,1);
      if(mode==='play'&&NET!=='guest'){const gx=b.wx*30+480,gz=b.wz*30+215;let hit=0;
        units.forEach(u=>{if(u.hp>0&&Math.hypot(u.x-gx,LANES[u.lane]-gz)<=75){u.hp-=100;hit++;fx(u.x,LANES[u.lane],100);burst(u.x,LANES[u.lane])}});
        burst(gx,gz);shake=.5;if(hit)adminSay('Ball hit '+hit+' fighter'+(hit>1?'s':'')+' for 100!')}}}}

function makeEgg(tubes){
  const a=tubes.filter(Boolean);let n={p:0,c:0,f:0,s:0},r=1;
  a.forEach(f=>{n.p+=f.p;n.c+=f.c;n.f+=f.f;n.s+=f.s});
  if(a.length>1)r=.75+Math.random()*.6;
  for(const k in n)n[k]*=r;
  const name=a.length>1?a[0].name.slice(0,Math.ceil(a[0].name.length/2))+a[1].name.slice(Math.floor(a[1].name.length/2)):a[0].name;
  return{name,e:a.map(f=>f.e),r,hp:Math.round(30+n.f*8+n.p*2),atk:+(2+n.p*1.3).toFixed(1),spd:Math.round(26+n.s*5),sta:Math.round(4+n.c*3),cost:Math.min(95,Math.round(10+(n.p+n.c+n.f+n.s)*1.2))};
}
function load(p,j){
  if(p.st!=='idle')return;
  const s=!p.tubes[0]?0:!p.tubes[1]?1:-1;if(s<0)return;
  p.tubes[s]=p.cards[j];p.cards[j]=rfp(p);
}
function startFuse(p){
  if(p.st!=='idle'||(!p.tubes[0]&&!p.tubes[1]))return;
  if(!(EV.free>0)&&p.en<8){p.flash=.4;return}
  if(!(EV.free>0))p.en-=8;p.st='walk';p.t=0;p.dur=1;p.dl=p.lane;p.lock=true;
}
function hatch(p){
  if(p.st!=='egg')return;
  const e=p.egg,fr=EV.free>0;if(!fr&&p.en<e.cost){p.flash=.4;return}
  if(!fr)p.en-=e.cost;const nx=STA[p.side].nx;
  units.push({side:p.side,x:nx,id:uid++,lane:p.dl,skin:p.skin|0,hp:e.hp,max:e.hp,atk:+(e.atk*(1+skb(p.skin|0)+(p.jet?.75:0))).toFixed(1),spd:e.spd,sta:e.sta,msta:e.sta,cd:0,e:e.e,t:Math.random()*6,fight:false});mkUnit(units[units.length-1]);burst(nx,LANES[p.dl]);if(EV.double>0)spawnFor(p,(p.dl+1)%3);
